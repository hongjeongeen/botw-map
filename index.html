<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#15130f">
  <title>하이랄 지도</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='5' fill='%23ffa726'/%3E%3Ccircle cx='12' cy='12' r='4.5' fill='none' stroke='%233a2200' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <div id="map" aria-label="하이랄 지도"></div>

    <!-- 데스크톱: 좌측 사이드바 / 모바일: 바텀시트 (CSS로 전환) -->
    <aside id="panel">
      <div class="handle" aria-hidden="true"></div>
      <nav class="tabs" role="tablist">
        <button data-tab="layers" class="active">레이어</button>
        <button data-tab="search">검색</button>
        <button data-tab="nearby">주변</button>
        <button data-tab="pins">핀</button>
        <button data-tab="settings">설정</button>
      </nav>
      <section data-tab="layers" class="active"></section>
      <section data-tab="search"></section>
      <section data-tab="nearby"></section>
      <section data-tab="pins"></section>
      <section data-tab="settings"></section>
    </aside>

    <!-- 모바일 전용 하단 바 (유일한 탭 메뉴: 시트 안의 탭 줄은 모바일에서 숨김) -->
    <nav id="bar">
      <button data-open="layers">레이어</button>
      <button data-open="search">검색</button>
      <button data-open="nearby">주변</button>
      <button data-open="pins">핀</button>
      <button data-open="settings">설정</button>
    </nav>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
